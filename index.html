<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Ad Studio Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: course portal in the course's own identity (graphite, warm white, amber); landing page on top, learning view with a sticky curriculum sidebar. */
:root{
  --bg:#F2F0EB; --surface:#FFFFFF; --ink:#111418; --muted:#5B6068; --line:#DDD9CF;
  --accent:#D9A441; --accent-ink:#8A5A00; --ok:#1F7A58; --bad:#B8372D; --soft:#EAE6DC;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --surface:#181C22; --ink:#F2F0EB; --muted:#A7ABB1; --line:#2B3038;
    --accent:#D9A441; --accent-ink:#E8B85A; --ok:#4CC095; --bad:#E7786C; --soft:#1F242B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#181C22; --ink:#F2F0EB; --muted:#A7ABB1; --line:#2B3038;
  --accent:#D9A441; --accent-ink:#E8B85A; --ok:#4CC095; --bad:#E7786C; --soft:#1F242B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent-ink);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4,h5{line-height:1.2;text-wrap:balance;letter-spacing:-.015em;margin:0 0 .6em}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700}
h2{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:650}
h3{font-size:1.2rem;font-weight:650} h4{font-size:1.05rem;font-weight:650}
p{margin:0 0 1em}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{font-weight:700;letter-spacing:.14em;font-size:.82rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand b{color:var(--accent-ink)}
nav.main{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.main a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:.92rem;font-weight:500}
nav.main a:hover{color:var(--ink);background:var(--soft)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--soft)}
.pill{font-size:.8rem;color:var(--muted);white-space:nowrap}
.pill b{color:var(--ink);font-variant-numeric:tabular-nums}
.strip{background:var(--soft);border-bottom:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.strip .wrap{padding-top:7px;padding-bottom:7px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font:600 .95rem var(--font);cursor:pointer;text-decoration:none}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#111418}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* hero */
.hero{padding:56px 0 36px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin-bottom:14px}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:32px}
.stat{border-top:2px solid var(--accent);padding-top:8px}
.stat b{display:block;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:.86rem}
section.block{padding:36px 0;border-top:1px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h3,.card h4{margin-bottom:.4em}
.card p:last-child{margin-bottom:0}
.num{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent-ink);margin-right:6px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok)} .tag.wip{color:var(--accent-ink);border-color:var(--accent)}
.loop{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.loop span{background:var(--soft);padding:6px 12px;border-radius:99px;font-weight:600;font-size:.9rem}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:6px 0 6px 22px;position:relative}
ul.clean li::before{content:"";position:absolute;left:0;top:.85em;width:8px;height:8px;background:var(--accent);border-radius:2px}
ul.clean.no li::before{background:var(--bad)}
/* accordion */
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details.acc>summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;gap:12px;align-items:center;justify-content:space-between}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-size:1.3rem;color:var(--muted)}
details.acc[open]>summary::after{content:"–"}
details.acc .inner{padding:0 16px 14px}
.lessons{list-style:none;padding:0;margin:0}
.lessons li{display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:.95rem}
.lessons a{text-decoration:none;color:var(--ink)} .lessons a:hover{text-decoration:underline}
.lessons .m{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.85rem}
/* learn layout */
.learn{display:grid;grid-template-columns:330px minmax(0,1fr);gap:36px;padding:28px 0 56px;align-items:start}
.side{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding-right:6px}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.side details{border-bottom:1px solid var(--line);padding:6px 0}
.side summary{cursor:pointer;font-weight:600;font-size:.92rem;padding:4px 0;display:flex;justify-content:space-between;gap:8px}
.side summary small{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.side a.it{display:flex;gap:8px;text-decoration:none;color:var(--muted);font-size:.88rem;padding:4px 6px;border-radius:6px;align-items:flex-start}
.side a.it:hover{background:var(--soft);color:var(--ink)}
.side a.it[aria-current="page"]{background:var(--soft);color:var(--ink);font-weight:600}
.dot{flex:0 0 14px;height:14px;margin-top:4px;border:1.5px solid var(--muted);border-radius:50%;position:relative}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.done::after{content:"✓";position:absolute;inset:-3px 0 0 0;text-align:center;font-size:10px;line-height:17px;color:#fff;font-weight:700}
.side-toggle{display:none}
.crumb{font-size:.84rem;color:var(--muted);margin-bottom:8px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.donebar{margin-top:32px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
/* prose */
.prose{max-width:74ch}
.prose h3,.prose h4,.prose h5{margin-top:1.6em}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 1em}
.prose li{margin:.25em 0}
.prose li.cb{list-style:none;margin-left:-1.3em;display:flex;gap:8px}
.prose .box{flex:0 0 18px;height:18px;border:1.5px solid var(--muted);border-radius:4px;margin-top:3px;font-size:12px;text-align:center;line-height:15px;color:var(--ok)}
.prose blockquote{margin:0 0 1em;padding:12px 16px;border-left:4px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0;font-size:.95rem}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--soft);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.prose pre{background:var(--soft);padding:14px;border-radius:8px;overflow-x:auto;font-size:.85rem;line-height:1.5}
.prose pre code{background:none;padding:0;overflow-wrap:normal}
.prose hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.tw{overflow-x:auto;margin:0 0 1.2em;border:1px solid var(--line);border-radius:8px}
.tw table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
.tw th,.tw td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tw th{background:var(--soft);font-weight:600}
.tw td.fx{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.tw tr:last-child td{border-bottom:0}
.note{font-size:.88rem;color:var(--muted)}
/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:74ch}
.quiz textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.ans{margin:16px 0;padding:14px;border-left:4px solid var(--ok);background:var(--soft);border-radius:0 8px 8px 0}
.score{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
/* misc */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50;max-width:90vw}
.res-list{display:grid;gap:10px}
.res{display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;flex-wrap:wrap}
.res b.code{font-variant-numeric:tabular-nums;color:var(--accent-ink);margin-right:8px}
.chk{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.chk input{margin-top:5px;width:18px;height:18px;accent-color:var(--ok)}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:.88rem;margin-top:20px}
footer a{color:var(--muted)}
.flow{display:grid;gap:10px}
.flow div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.flow div b{color:var(--accent-ink)}

/* --- team round 2: motion, home visuals, search, misc --- */
.hero2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;padding:52px 0 28px}
.hero2 .lead{font-size:1.15rem;color:var(--muted);max-width:56ch}
.mon{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 30px -18px rgba(17,20,24,.35)}
.tl{position:relative;display:flex;gap:3px;height:62px}
.shot{display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;border-radius:5px;background:color-mix(in srgb,var(--accent) 30%,var(--surface));font-size:.7rem;line-height:1.2;min-width:0;overflow:hidden}
.shot b{font-variant-numeric:tabular-nums} .shot span{color:var(--muted);font-variant-numeric:tabular-nums}
.shot.gfx{background:var(--soft);border:1px dashed var(--muted)}
.tl .ph{position:absolute;top:-6px;bottom:-6px;left:0;width:2px;background:var(--ink);border-radius:2px;animation:sweep 8s linear infinite}
.tl .ph::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;background:var(--ink);border-radius:50%}
.scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
@keyframes sweep{from{left:0}to{left:calc(100% - 2px)}}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
@keyframes fadein{from{opacity:.55}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.stats.six{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:st}
.step{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:.92rem}
.step small{display:block;color:var(--accent-ink);font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:2px}
.step.wip{border-top-color:var(--line);color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fields div{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.88rem}
.fields b{display:block;color:var(--accent-ink);font-size:.78rem}
.weak{background:var(--soft);border-left:4px solid var(--bad);padding:10px 14px;border-radius:0 8px 8px 0;font-family:var(--mono);font-size:.85rem;margin:8px 0 14px;overflow-wrap:anywhere}
.chip{display:inline-block;background:var(--soft);border-radius:99px;padding:3px 12px;font-size:.82rem;margin:0 0 10px;color:var(--ink)}
.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;margin:4px 0 8px}
.sres{display:grid;gap:6px}
.sres a{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem}
.sres a:hover{border-color:var(--accent)} .sres small{display:block;color:var(--muted)}
.pitch{white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:14px;font-size:.92rem;margin:8px 0 10px}
.btn,.card,.step,.res{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,opacity .15s}
.card:hover,.step:hover,.res:hover{transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(17,20,24,.45);border-color:var(--accent)}
.bar i{transform-origin:left;animation:grow .9s ease both}
main{animation:fadein .22s ease both}
.hero2>*,section.block.in .grid>*{animation:rise .55s ease both}
.hero2>*:nth-child(2){animation-delay:.12s}
section.block.in .grid>*:nth-child(2){animation-delay:.06s} section.block.in .grid>*:nth-child(3){animation-delay:.12s} section.block.in .grid>*:nth-child(4){animation-delay:.18s}
.btn.small,nav.main a,.side a.it{min-height:40px}
nav.main a{display:inline-flex;align-items:center}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
#main:focus,#main:focus-visible{outline:none}
.shot span{white-space:nowrap}
@media (max-width:700px){
  .shot{padding:5px 3px;font-size:.62rem}
  .shot span{font-size:.58rem}
  nav.main{-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent)}
}
@media (max-width:900px){ .hero2{grid-template-columns:1fr;gap:24px;padding-top:32px} }
@media (max-width:900px){
  .learn{grid-template-columns:1fr;gap:16px}
  .side{position:static;max-height:none;display:none}
  .side.open{display:block}
  .side-toggle{display:inline-flex}
}
@media (max-width:700px){
  .top{position:static}
  .top .wrap{gap:4px 12px}
  nav.main{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
  nav.main a{white-space:nowrap;padding:6px 10px}
  .pill{margin-left:auto}
  .strip{font-size:.8rem}
}
@media (max-width:520px){ .wrap{padding:0 16px} .hero{padding:36px 0 24px} .quiz{padding:16px} }
@media (prefers-reduced-motion:no-preference){ .btn{transition:opacity .15s} }
body[data-dl="off"] .btn-dl{display:none}
.lockbox{border:1px solid var(--line);border-radius:16px;padding:22px 24px;background:var(--surface)}.lockbox .lk{font-weight:700;font-size:1.1rem}
</style>
</head>
<body data-dl="on">
<div id="app"></div>

<script>
/* Hosts like htmlpreview inject <base href="raw URL">, which makes "#page" links leave the site.
   Remove any <base> and route in-page links ourselves. */
document.querySelectorAll('base').forEach(b=>b.remove());
document.addEventListener('click', e=>{
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if(!a || e.defaultPrevented || e.button!==0 || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  const h = a.getAttribute('href');
  if(h.length>1){ if(location.hash===h){ window.dispatchEvent(new HashChangeEvent('hashchange')); } else { location.hash = h; } }
}, true);
const D = {"modules": [{"id": "m01", "n": 1, "title": "Основы коммерческого AI-видео", "deliverable": "Заполненный коммерческий бриф", "meta": "Редакция: RU · Версия: v0.1 · Статус: Drafted · Среда: 📱 телефон / 💻 компьютер (платные инструменты не нужны)", "items": [{"id": "m01-1", "t": "Обзор и цели модуля", "kind": "overview", "html": "<p><em>Редакция: RU · Версия: v0.1 · Статус: Drafted · Среда: 📱 телефон / 💻 компьютер (платные инструменты не нужны)<\/em><\/p>\n<h3>Зачем это нужно коммерчески<\/h3>\n<p>Клиент платит не за красивую картинку, а за изменение: больше заявок, больше узнаваемости, больше покупок. Если ролик красив, но зритель не понял, что продаётся и что делать дальше, реклама не сработала. Нейросети делают красивое видео почти бесплатно, поэтому красота перестала быть редким навыком. Редкий навык — понимать, ЗАЧЕМ ролик существует, и уметь собрать его так, чтобы он эту задачу решал.<\/p>\n<p>Этот модуль даёт фундамент: язык, на котором вы будете говорить с клиентом, и порядок работы, который вы будете повторять в каждом проекте.<\/p>\n<h3>Результаты обучения (измеримые)<\/h3>\n<p>После модуля вы сможете:<\/p>\n<ol><li>Объяснить своими словами разницу между «красивым видео» и «эффективной рекламой» и привести по одному примеру каждого.<\/li><li>Отличить характеристику товара от выгоды клиента и переписать пять характеристик в пять выгод.<\/li><li>Сформулировать цель кампании одним предложением с проверяемым результатом.<\/li><li>Написать ценностное предложение по шаблону и проверить его тестом «ну и что?».<\/li><li>Выбрать один призыв к действию, подходящий этапу воронки.<\/li><li>Назвать этапы производственного конвейера и пункты, где обязателен человеческий контроль.<\/li><li>Заполнить полный коммерческий бриф (итоговая работа модуля).<\/li><\/ol>\n<h3>Что нужно знать заранее<\/h3>\n<p>Ничего специального. Нужен блокнот или документ и один реальный товар или услуга для практики (свой, знакомого или вымышленный с чёткой пометкой «вымышленный»).<\/p>\n<hr>", "min": 1}, {"id": "m01-2", "t": "Урок 1.1. Что такое AI-ассистированное коммерческое видео", "kind": "lesson", "html": "<p><strong>Определение.<\/strong> Коммерческое видео — ролик, созданный, чтобы привести зрителя к конкретному действию в интересах бизнеса: узнать бренд, перейти по ссылке, написать, купить. «AI-ассистированное» означает, что часть кадров, звука или текста создаётся генеративными моделями, а решения принимает человек.<\/p>\n<p><strong>Что нейросеть делает хорошо (на сегодня, как профессиональная оценка автора курса):<\/strong><\/p>\n<ul><li>создаёт короткие кадры (обычно несколько секунд) по описанию или по изображению;<\/li><li>быстро даёт варианты настроения, света, окружения;<\/li><li>заменяет съёмку там, где съёмка дорога или невозможна (необычные локации, абстрактные сцены).<\/li><\/ul>\n<p><strong>Что она делает ненадёжно:<\/strong><\/p>\n<ul><li>точная форма и надписи на реальном товаре (логотип, этикетка, мелкий текст);<\/li><li>длинные сцены с одним и тем же героем без искажений;<\/li><li>сложные действия руками, точная синхронизация губ и речи;<\/li><li>повторяемость: одна и та же команда даёт разные результаты.<\/li><\/ul>\n<p>Из этого следует главное правило курса: <strong>нейросеть — это съёмочная группа с непредсказуемым оператором. Режиссёром остаётесь вы.<\/strong><\/p>\n<blockquote>Пометка достоверности: перечень сильных и слабых сторон — профессиональная рекомендация, а не измерение. Возможности моделей меняются быстро; в Модуле 7 они сверяются с документацией на дату проверки.<\/blockquote>", "min": 1}, {"id": "m01-3", "t": "Урок 1.2. Красивое против эффективного", "kind": "lesson", "html": "<p>Возьмите два ролика о кофе.<\/p>\n<p><strong>Слабый ролик (красивый, но пустой).<\/strong> 12 секунд: зерно в замедленной съёмке, пар над чашкой, золотой свет, музыка. Нет названия, нет причины купить, нет действия.<\/p>\n<p><strong>Сильный ролик.<\/strong> 15 секунд: в первые 2 секунды видна проблема («Кофе в офисе остыл, пока вы дописывали письмо»), затем показан продукт (термокружка) в использовании, затем одна выгода («Горячий 6 часов» — только если это подтверждено паспортом изделия), затем действие («Закажите на сайте»).<\/p>\n<p>Почему второй лучше: у него есть <strong>цель, зритель, обещание, доказательство и действие.<\/strong> Первый показывает атмосферу и надеется, что зритель сам всё поймёт.<\/p>\n<p><strong>Тест из пяти вопросов (применяйте к любому ролику, чужому и своему):<\/strong><\/p>\n<ol><li>Кому это показано? (кто зритель)<\/li><li>Что продаётся? (виден ли товар)<\/li><li>Почему это нужно именно зрителю? (выгода)<\/li><li>Почему этому можно верить? (доказательство)<\/li><li>Что зритель должен сделать после просмотра? (призыв)<\/li><\/ol>\n<p>Если на два вопроса из пяти нельзя ответить — это не реклама, это видеообои.<\/p>", "min": 1}, {"id": "m01-4", "t": "Урок 1.3. Аудитория, продукт, предложение, цель", "kind": "lesson", "html": "<p>Четыре опоры любого брифа:<\/p>\n<p><strong>Аудитория.<\/strong> Не «все», а конкретная группа с конкретной ситуацией. Слабо: «женщины 18–45». Сильнее: «владелицы небольших кофеен, которые ищут способ показывать новинки в соцсетях без съёмочной группы». Описывайте ситуацию, а не только возраст.<\/p>\n<p><strong>Продукт.<\/strong> Что именно это и чем отличается от соседнего. Записывайте факты, которые можно проверить (материал, объём, срок, цена), отдельно от впечатлений («стильный», «уникальный»).<\/p>\n<p><strong>Предложение (оффер).<\/strong> Что получает покупатель и на каких условиях: «первый заказ со скидкой 10% до конца месяца». Если акции нет, оффер может быть другим — бесплатная консультация, пробная версия.<\/p>\n<p><strong>Цель кампании.<\/strong> Одно предложение с проверяемым результатом. Формула: <em>«Получить [действие] от [аудитория] через [канал] за [срок]»<\/em>.<\/p>\n<ul><li>Слабо: «Повысить продажи».<\/li><li>Сильнее: «Получить заявки на бесплатную примерку от жителей города через Instagram Reels за 30 дней».<\/li><\/ul>\n<p>В этом курсе числовые цели (например, «100 заявок») задаются клиентом или вами как гипотеза и помечаются «гипотеза», пока нет реальных данных.<\/p>", "min": 1}, {"id": "m01-5", "t": "Урок 1.4. Позиционирование, характеристики и выгоды, ценностное предложение", "kind": "lesson", "html": "<p><strong>Позиционирование<\/strong> — место бренда в голове клиента относительно альтернатив. Вопрос, на который оно отвечает: «Почему выбирать нас, а не соседа?»<\/p>\n<p><strong>Характеристика → выгода.<\/strong> Характеристика — свойство товара. Выгода — что изменится в жизни клиента.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Характеристика<\/th><th>Выгода (слабая)<\/th><th>Выгода (сильная)<\/th><\/tr><\/thead><tbody><tr><td>Корпус из алюминия<\/td><td>Прочный<\/td><td>Не помнётся в сумке — не нужно носить в чехле<\/td><\/tr><tr><td>Батарея 5000 мАч<\/td><td>Мощная<\/td><td>Хватает на день съёмок без розетки<\/td><\/tr><tr><td>Доставка за 1 день<\/td><td>Быстро<\/td><td>Заказали вечером — завтра к ужину на столе<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Ценностное предложение<\/strong> (шаблон): <em>Для [аудитория], которой нужно [задача], [продукт] — это [категория], который [главная выгода], в отличие от [альтернатива], которая [её недостаток].<\/em><\/p>\n<p>Проверка «ну и что?»: прочитайте предложение вслух и спросите себя «ну и что?» после каждой фразы. Если ответа нет — фраза лишняя.<\/p>\n<p><strong>Утверждения в рекламе требуют подтверждения.<\/strong> Любое «лучший», «№1», «в 2 раза быстрее», «безопасно» и любые обещания по здоровью или заработку нужно либо подтвердить документом, либо не использовать. Подробнее — в Модулях 2 и 12.<\/p>", "min": 1}, {"id": "m01-6", "t": "Урок 1.5. Призыв к действию и воронка", "kind": "lesson", "html": "<p>Зритель проходит путь: <strong>узнал → заинтересовался → сравнил → купил → вернулся.<\/strong> Реклама, выбранная для одного этапа, не работает на другом.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Этап<\/th><th>Задача ролика<\/th><th>Пример призыва<\/th><\/tr><\/thead><tbody><tr><td>Знакомство (осведомлённость)<\/td><td>Запомниться, назвать проблему<\/td><td>«Подпишитесь, чтобы увидеть, как это работает»<\/td><\/tr><tr><td>Интерес<\/td><td>Показать, как это решает задачу<\/td><td>«Узнайте подробности по ссылке»<\/td><\/tr><tr><td>Намерение купить<\/td><td>Убрать сомнения, дать оффер<\/td><td>«Закажите сейчас — доставка завтра»<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Правило: <strong>один ролик — один призыв.<\/strong> Если просить подписаться, перейти по ссылке и написать в мессенджер одновременно, зритель не делает ничего.<\/p>", "min": 1}, {"id": "m01-7", "t": "Урок 1.6. Ограничения и производственный конвейер", "kind": "lesson", "html": "<p><strong>Ограничения<\/strong> — это не помеха, а часть творчества. Запишите их до идей:<\/p>\n<ul><li>длительность (6, 15, 30 секунд), формат (вертикальный 9:16, квадрат, горизонтальный);<\/li><li>бюджет на генерации и время;<\/li><li>обязательные элементы бренда (логотип, цвета, фраза);<\/li><li>запреты клиента (темы, образы, конкуренты);<\/li><li>юридические требования (надписи, возрастные ограничения).<\/li><\/ul>\n<p><strong>Конвейер проекта<\/strong> (его вы будете повторять во всех модулях):<\/p>\n<ol><li>Бриф и цель (Модуль 1, 3)<\/li><li>Анализ и концепция (Модуль 2)<\/li><li>Сценарий и раскадровка (Модуль 6)<\/li><li>Референсы и промпты (Модули 4, 5)<\/li><li>Генерация кадров (Модуль 7)<\/li><li>Звук (Модуль 8)<\/li><li>Монтаж и цвет (Модуль 9)<\/li><li>Проверка качества (Модуль 10)<\/li><li>Права и соответствие (Модуль 12)<\/li><li>Сдача клиенту и обратная связь (Модуль 13)<\/li><\/ol>", "min": 1}, {"id": "m01-8", "t": "Урок 1.7. Человеческий контроль и творческое суждение", "kind": "lesson", "html": "<p>Нейросеть не знает вашего клиента, не отвечает за ложные обещания и не видит, что логотип искажён. Поэтому на каждом этапе есть <strong>контрольная точка<\/strong>:<\/p>\n<div class=\"tw\"><table><thead><tr><th>Этап<\/th><th>Что проверяет человек<\/th><\/tr><\/thead><tbody><tr><td>Бриф<\/td><td>Цель измерима? Аудитория конкретна?<\/td><\/tr><tr><td>Концепция<\/td><td>Идея решает задачу, а не просто красива?<\/td><\/tr><tr><td>Генерация<\/td><td>Товар узнаваем? Нет искажений, чужих логотипов, похожих на реальных людей лиц?<\/td><\/tr><tr><td>Монтаж<\/td><td>Читаются надписи, понятен порядок, слышна речь?<\/td><\/tr><tr><td>Сдача<\/td><td>Все утверждения подтверждены? Лицензии на музыку и шрифты есть?<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Принцип: <strong>ничего не уходит клиенту, пока человек лично не посмотрел каждую секунду.<\/strong><\/p>\n<hr>", "min": 1}, {"id": "m01-9", "t": "Практика, разбор и частые ошибки", "kind": "practice", "html": "<h3>Пошаговая процедура: как составить коммерческий бриф (30–45 минут)<\/h3>\n<ol><li>Выберите товар или услугу (реальную или вымышленную с пометкой).<\/li><li>Выпишите 5 проверяемых фактов о продукте.<\/li><li>Опишите аудиторию через ситуацию (кто, где, что пытается сделать).<\/li><li>Превратите 5 характеристик в 5 выгод по таблице урока 1.4.<\/li><li>Сформулируйте цель по формуле урока 1.3.<\/li><li>Напишите ценностное предложение и пройдите тест «ну и что?».<\/li><li>Выберите этап воронки и ОДИН призыв.<\/li><li>Запишите ограничения (формат, длительность, бюджет, запреты).<\/li><li>Запишите, какие утверждения требуют подтверждения.<\/li><li>Заполните шаблон <a href=\"#res-t01\">T01<\/a> (файл <a href=\"#res-t01\"><code>RU/toolkit/T01_brif_shablon.md<\/code><\/a>).<\/li><\/ol>\n<h3>Разобранный пример (вымышленный)<\/h3>\n<p><strong>Вымышленный бренд:<\/strong> «Нордик Бристоль» — небольшая мастерская кожаных кошельков (бренд придуман для примера, к реальным компаниям отношения не имеет).<\/p>\n<ul><li>Продукт (факты, придуманные для примера): кошелёк из натуральной кожи, 6 отделений, толщина 8 мм, ручная прошивка.<\/li><li>Аудитория: мужчины 25–40, которые носят кошелёк в заднем кармане и жалуются, что он «оттопыривается».<\/li><li>Характеристика → выгода: толщина 8 мм → «не оттопыривается под брюками».<\/li><li>Цель: получить 30 заказов с лендинга за 30 дней через Instagram Reels (гипотеза, не подтверждена данными).<\/li><li>Ценностное предложение: «Для мужчин, которые носят кошелёк в кармане, “Нордик Бристоль” — это тонкий кожаный кошелёк, который не оттопыривается, в отличие от объёмных моделей с лишними отделениями».<\/li><li>Этап воронки: намерение купить. Призыв: «Заказать на сайте».<\/li><li>Утверждения, требующие подтверждения: «натуральная кожа» (сертификат/накладная на материал), «ручная прошивка» (мастерская подтверждает).<\/li><\/ul>\n<h4>Дополнение: слабый и сильный бриф (на одном и том же товаре)<\/h4>\n<p><strong>Слабый бриф (вымышленный):<\/strong><br>«Бренд: Нордик Бристоль. Нужен стильный современный ролик для продажи кошельков. Целевая аудитория: мужчины. Хочется премиально.»<br>Что не так: нет цели, нет фактов, аудитория без ситуации, прилагательные вместо доказательств, не сказано, какое действие ждём.<\/p>\n<p><strong>Сильный бриф (фрагмент):<\/strong><br>«Цель (гипотеза): 30 заказов с лендинга за 30 дней через Reels. Аудитория: мужчины 25–40, носят кошелёк в заднем кармане, жалуются, что он оттопыривается. Факты: толщина 8 мм, натуральная кожа (накладная на материал), ручная прошивка. Выгода: не оттопыривается под брюками. Один призыв: “Заказать на сайте”. Утверждения для проверки: “натуральная кожа” — документ от мастерской.»<br>Почему лучше: каждое слово можно проверить или превратить в решение по кадру.<\/p>\n<p><strong>Практика:<\/strong> возьмите свой слабый бриф из прошлых попыток (если есть) и перепишите его по шаблону <a href=\"#res-t01\">T01<\/a>. Сравните: что из слабого брифа вы не смогли подтвердить?<\/p>\n<h3>Частые ошибки<\/h3>\n<ol><li><strong>Бриф из прилагательных<\/strong> («стильный, современный, премиальный») без фактов. Исправление: каждому прилагательному — доказательство или удалить.<\/li><li><strong>Цель «повысить продажи».<\/strong> Исправление: действие + аудитория + канал + срок.<\/li><li><strong>Несколько призывов в одном ролике.<\/strong> Исправление: один.<\/li><li><strong>Начинать с инструмента.<\/strong> Люди открывают нейросеть до того, как знают, что хотят сказать. Исправление: сначала бриф.<\/li><li><strong>Доверять результату на глаз за 2 секунды.<\/strong> Исправление: просматривать покадрово и по чек-листу контроля.<\/li><li><strong>Обещать то, что нельзя подтвердить.<\/strong> Исправление: см. урок 1.4.<\/li><\/ol>\n<h3>Если не получается (диагностика)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Симптом<\/th><th>Вопрос для диагностики<\/th><th>Что делать<\/th><\/tr><\/thead><tbody><tr><td>Не могу сформулировать цель<\/td><td>Кто и что должен сделать после просмотра?<\/td><td>Начните с действия и допишите остальное<\/td><\/tr><tr><td>Все выгоды звучат одинаково<\/td><td>Чем отличается от соседнего товара?<\/td><td>Сравните с двумя конкурентами в таблице<\/td><\/tr><tr><td>Бриф получился на 3 страницы<\/td><td>Есть ли в нём то, что не влияет на решения?<\/td><td>Оставьте то, что меняет концепцию или цену<\/td><\/tr><tr><td>Клиент не даёт информацию<\/td><td>Что именно мешает?<\/td><td>Дайте анкету (Модуль 3), задавайте закрытые вопросы<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Практические задания<\/h3>\n<p><strong>Начальный (30 мин, 📱).<\/strong> Выберите любую рекламу, которую вы видели сегодня, и ответьте письменно на 5 вопросов из урока 1.2.<\/p>\n<p><strong>Средний (60 мин, 📱💻).<\/strong> Возьмите реальный товар (свой или знакомого) и заполните шаблон <a href=\"#res-t01\">T01<\/a> полностью.<\/p>\n<p><strong>Продвинутый (90 мин, 💻).<\/strong> Составьте два брифа для одного и того же товара под две разные аудитории и объясните, что поменялось в цели, оффере и призыве.<\/p>", "min": 4}, {"id": "m01-10", "t": "Контрольный тест", "kind": "quiz", "html": "", "min": 2}, {"id": "m01-11", "t": "Итоговая работа, рубрика и источники", "kind": "wrap", "html": "<h3>Рабочий лист<\/h3>\n<p>См. <a href=\"#res-t01\"><code>RU/toolkit/T01_brif_shablon.md<\/code><\/a> (готовый к заполнению шаблон).<\/p>\n<h3>Рубрика оценки итоговой работы (бриф)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Критерий<\/th><th>Вес<\/th><th>0 баллов<\/th><th>Полный балл<\/th><\/tr><\/thead><tbody><tr><td>Цель измерима и содержит действие, аудиторию, канал, срок<\/td><td>25%<\/td><td>Цель общая<\/td><td>Все 4 элемента, помечена гипотеза<\/td><\/tr><tr><td>Аудитория описана через ситуацию<\/td><td>15%<\/td><td>Только возраст/пол<\/td><td>Ситуация + задача + барьер<\/td><\/tr><tr><td>Характеристики превращены в выгоды<\/td><td>20%<\/td><td>Выгод нет<\/td><td>≥5 пар, каждая проверяема<\/td><\/tr><tr><td>Ценностное предложение прошло тест «ну и что?»<\/td><td>15%<\/td><td>Не пройдено<\/td><td>Каждая фраза работает<\/td><\/tr><tr><td>Один призыв, соответствующий этапу воронки<\/td><td>10%<\/td><td>Несколько призывов<\/td><td>Один и по этапу<\/td><\/tr><tr><td>Ограничения и утверждения для проверки<\/td><td>15%<\/td><td>Не указаны<\/td><td>Перечислены и привязаны к доказательствам<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Порог: 70% — зачёт. 80%+ — «компетентно».<\/p>\n<h3>Критерии завершения модуля<\/h3>\n<ul><li class=\"cb\"><span class=\"box\" aria-hidden=\"true\"><\/span>Выполнены задания начального и среднего уровня.<\/li><li class=\"cb\"><span class=\"box\" aria-hidden=\"true\"><\/span>Контрольный тест пройден на ≥70%.<\/li><li class=\"cb\"><span class=\"box\" aria-hidden=\"true\"><\/span>Бриф заполнен и набрал ≥70% по рубрике.<\/li><li class=\"cb\"><span class=\"box\" aria-hidden=\"true\"><\/span>Вы можете объяснить конвейер проекта без подсказок.<\/li><\/ul>\n<h3>Источники и дополнительное чтение<\/h3>\n<p>Модуль основан на общих принципах рекламной практики и собственной методике автора; конкретные цифры не используются. Утверждения о возможностях инструментов проверяются в Модуле 7 (см. <a href=\"#res-ref-register\"><code>00_MASTER/SOURCE_REGISTER.md<\/code><\/a>).<\/p>\n<p>Правило честности: статистика о «росте конверсии» в этом модуле намеренно не приводится, так как не проверялась по первичным источникам.<\/p>", "min": 1}], "quiz": [{"q": "Какое утверждение описывает выгоду, а не характеристику?\nА) Вес 180 граммов Б) Помещается в карман джинсов, поэтому его не нужно оставлять дома В) Корпус из пластика Г) Экран 6,1 дюйма", "a": "Б. Выгода говорит, что изменится у клиента. Остальные варианты — свойства товара."}, {"q": "Какая цель сформулирована правильно?\nА) Повысить узнаваемость Б) Сделать красивый ролик В) Получить 20 записей на пробное занятие от жителей района через Reels за 30 дней Г) Рассказать о клубе", "a": "В. Есть действие, аудитория, канал, срок. Число — гипотеза, её нужно пометить."}, {"q": "Ролик завершается словами «Подпишитесь, закажите и напишите нам». Что не так?", "a": "Три разных призыва размывают внимание. Нужен один, соответствующий этапу воронки."}, {"q": "Нейросеть выдала красивый кадр, где на упаковке другой логотип. Что делаете?", "a": "Кадр отклоняется или исправляется: товар клиента должен быть узнаваем и точен. Искажённый логотип — прямая ошибка для бренда."}, {"q": "Зачем нужен тест «ну и что?» для ценностного предложения?", "a": "Он убирает фразы, которые ничего не обещают клиенту. Если после фразы нет ответа на «ну и что?», она не работает на продажу."}, {"q": "Ролик показывает красивые кадры кофе, но нет названия бренда и призыва. Какие вопросы из теста пяти не выполнены?", "a": "Вопрос 2 (что продаётся), вопрос 5 (что делать после просмотра); вероятно, и 3–4, если выгода и доказательство не показаны. Это видеообои, а не реклама."}, {"q": "У клиента есть характеристика «батарея 4000 мАч», но нет данных о времени работы. Как оформить выгоду?", "a": "Не придумывать цифры. Запишите в бриф «время работы — НЕТ ДАННЫХ, запросить у клиента тест или паспорт» и до получения данных не использовать утверждения о часах работы."}, {"q": "На каком этапе конвейера человек обязан лично проверить, что логотип клиента не искажён?", "a": "После генерации, после монтажа и перед сдачей. Ошибки логотипа появляются на любом этапе, поэтому проверка повторяется."}, {"q": "Клиент не знает, сколько заказов ему нужно. Как записать цель?", "a": "Предложить числовую цель как гипотезу и пометить «гипотеза, подтвердить данными клиента». Не выдавать число за факт."}, {"q": "Почему нельзя начинать работу с выбора инструмента?", "a": "Инструмент решает, как сделать кадр, а не что сказать и кому. Без брифа вы получите красивые кадры, которые нельзя оценить, потому что не с чем сравнивать."}]}, {"id": "m02", "n": 2, "title": "Анализ рекламы и креативная стратегия", "deliverable": "Три оригинальные концепции с обоснованием", "meta": "Редакция: RU · Версия: v0.1 · Статус: Drafted · Среда: 📱💻 (платные инструменты не нужны)", "items": [{"id": "m02-1", "t": "Обзор и цели модуля", "kind": "overview", "html": "<p><em>Редакция: RU · Версия: v0.1 · Статус: Drafted · Среда: 📱💻 (платные инструменты не нужны)<\/em><\/p>\n<h3>Зачем это нужно коммерчески<\/h3>\n<p>Клиент редко формулирует идею. Он говорит «хочу что-то как у них». Умение разобрать чужой ролик на части и построить СВОЮ идею для той же задачи отличает исполнителя от копииста. Копия — это юридический риск (Модуль 12), слабая позиция в переговорах и отсутствие портфолио, которое продаёт вас, а не чужую работу.<\/p>\n<h3>Результаты обучения<\/h3>\n<p>После модуля вы сможете:<\/p>\n<ol><li>Разобрать рекламный ролик покадрово по шести элементам (крючок, проблема, демонстрация, выгода, доказательство, призыв).<\/li><li>Описать визуальную иерархию кадра и найти, куда смотрит зритель в первую секунду.<\/li><li>Назвать структуру повествования и эмоциональный тон ролика.<\/li><li>Оценить заметность продукта и релевантность аудитории.<\/li><li>Отделить приём (можно использовать) от выражения (нельзя копировать).<\/li><li>Выявить утверждения, требующие доказательств.<\/li><li>Предложить три оригинальные концепции для одного продукта с обоснованием.<\/li><li>Объяснить, что креативный тест может и чего не может показать.<\/li><\/ol>\n<h3>Что нужно знать заранее<\/h3>\n<p>Модуль 1 пройден, у вас есть заполненный бриф.<\/p>\n<hr>", "min": 1}, {"id": "m02-2", "t": "Урок 2.1. Как анализировать, не копируя", "kind": "lesson", "html": "<p><strong>Принцип.<\/strong> Идеи и приёмы свободны, конкретное выражение защищено. Приём «показать проблему в первые две секунды» — общий. Конкретные кадры, персонажи, музыка и текст конкретного ролика — чужая работа.<\/p>\n<p><strong>Правило трёх шагов:<\/strong><\/p>\n<ol><li><strong>Разберите<\/strong> ролик на элементы (таблица ниже).<\/li><li><strong>Выделите приёмы<\/strong> — что сделано и зачем, без привязки к деталям.<\/li><li><strong>Постройте своё<\/strong> — другая ситуация, другие образы, другая подача, применив тот же приём к вашему продукту.<\/li><\/ol>\n<p><strong>Тест на копию:<\/strong> если зритель, увидев вашу работу, назовёт исходный ролик, вы повторили выражение, а не приём. Меняйте.<\/p>\n<blockquote>Это образовательное объяснение, не юридическая консультация. Границы допустимого зависят от страны.<\/blockquote>", "min": 1}, {"id": "m02-3", "t": "Урок 2.2. Шесть элементов рекламного ролика", "kind": "lesson", "html": "<div class=\"tw\"><table><thead><tr><th>Элемент<\/th><th>Вопрос<\/th><th>Пример разбора (вымышленный ролик про термокружку)<\/th><\/tr><\/thead><tbody><tr><td>Крючок<\/td><td>Что удерживает в первые 1–3 секунды?<\/td><td>Крупный план остывшего кофе, рука с телефоном<\/td><\/tr><tr><td>Проблема<\/td><td>Какая боль названа или показана?<\/td><td>Забыл кофе на столе, остыл<\/td><\/tr><tr><td>Демонстрация<\/td><td>Как продукт решает задачу в действии?<\/td><td>Кружка открыта через 6 часов, идёт пар<\/td><\/tr><tr><td>Выгода<\/td><td>Что изменится для зрителя?<\/td><td>Горячий кофе в любой момент<\/td><\/tr><tr><td>Доказательство<\/td><td>Почему верить?<\/td><td>Показан паспорт изделия с параметрами (если он реален)<\/td><\/tr><tr><td>Призыв<\/td><td>Что делать дальше?<\/td><td>«Закажите на сайте»<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Не у каждого ролика есть все шесть. Отсутствие элемента — тоже информация: «ролик без доказательства — пустое обещание».<\/p>", "min": 1}, {"id": "m02-4", "t": "Урок 2.3. Визуальная иерархия", "kind": "lesson", "html": "<p>Зритель смотрит на кадр не равномерно. Порядок обычно определяют: <strong>размер, контраст, движение, лица/глаза, свет, положение в кадре.<\/strong><\/p>\n<p>Упражнение «моргание»: приостановите кадр на 1 секунду, отведите взгляд, снова взгляните. Что увидели первым? Если это не продукт и не главное действие — иерархия работает против вас.<\/p>\n<p>Правила для рекламы:<\/p>\n<ul><li>продукт должен быть либо самым контрастным, либо находиться там, куда ведёт взгляд (направление взгляда героя, линии, движение);<\/li><li>фон не должен конкурировать с продуктом по яркости и детализации;<\/li><li>текст на экране читается минимум 1–2 секунды (проверяется на телефоне).<\/li><\/ul>", "min": 1}, {"id": "m02-5", "t": "Урок 2.4. Структуры повествования для короткой рекламы", "kind": "lesson", "html": "<div class=\"tw\"><table><thead><tr><th>Структура<\/th><th>Суть<\/th><th>Подходит для<\/th><\/tr><\/thead><tbody><tr><td>Проблема → решение<\/td><td>Показать боль и снять её<\/td><td>Бытовые товары, сервисы<\/td><\/tr><tr><td>До → после<\/td><td>Состояние до и после<\/td><td>Услуги с видимым результатом (только честные, см. ниже)<\/td><\/tr><tr><td>Демонстрация<\/td><td>Показать, как работает<\/td><td>Товары с понятным действием<\/td><\/tr><tr><td>Настроение (атмосфера)<\/td><td>Создать ощущение, связать с брендом<\/td><td>Премиум, парфюм, образ жизни<\/td><\/tr><tr><td>История клиента<\/td><td>Мини-сюжет с героем<\/td><td>Услуги, локальный бизнес<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Честность в «до-после»: не показывайте результат, который не гарантирован. Подробности — в Модуле 13 и 12.<\/p>", "min": 1}, {"id": "m02-6", "t": "Урок 2.5. Эмоциональный тон и релевантность", "kind": "lesson", "html": "<p>Выберите ОДИН главный тон ролика: уверенность, облегчение, радость, интерес, спокойствие, лёгкая ирония. Тон определяет музыку, темп монтажа, свет и цвет.<\/p>\n<p>Проверка релевантности: прочтите описание аудитории из брифа и спросите «узнают ли они в этом ролике себя и свою ситуацию?» Если герой, обстановка и язык чужие — ролик адресован не тем.<\/p>", "min": 1}, {"id": "m02-7", "t": "Урок 2.6. Различие и позиция", "kind": "lesson", "html": "<p>Что делают все конкуренты? Посмотрите 5 роликов в категории и выпишите повторяющиеся образы (например, «золотой свет, замедленная съёмка, одинокий человек у окна»). Ваша задача — не быть пятым одинаковым.<\/p>\n<p>Способы различия: другая ситуация, другой герой, другой масштаб (крупнее/мельче), другой ритм, неожиданный, но уместный угол.<\/p>", "min": 1}, {"id": "m02-8", "t": "Урок 2.7. Утверждения и доказательства", "kind": "lesson", "html": "<p>Для каждого утверждения в ролике ответьте: чем это подтверждается?<\/p>\n<div class=\"tw\"><table><thead><tr><th>Тип утверждения<\/th><th>Что нужно<\/th><\/tr><\/thead><tbody><tr><td>Технический параметр («6 часов»)<\/td><td>Паспорт, тест, документ производителя<\/td><\/tr><tr><td>Сравнение («быстрее конкурентов»)<\/td><td>Конкретное сравнение, условия теста<\/td><\/tr><tr><td>Превосходная степень («лучший»)<\/td><td>Источник рейтинга или не использовать<\/td><\/tr><tr><td>Здоровье, финансы, заработок<\/td><td>Особые правила, часто юридическая проверка; без доказательств не использовать<\/td><\/tr><tr><td>Отзывы<\/td><td>Только реальные, с согласием автора; выдуманные отзывы запрещены<\/td><\/tr><\/tbody><\/table><\/div>", "min": 1}, {"id": "m02-9", "t": "Урок 2.8. Креативные тесты и их пределы", "kind": "lesson", "html": "<p>Креативный тест — показ нескольких вариантов ролика и сравнение результатов.<\/p>\n<p><strong>Что он может показать:<\/strong> какой из двух вариантов в данных условиях получил больше целевых действий.<\/p>\n<p><strong>Чего он НЕ показывает (ограничения):<\/strong><\/p>\n<ul><li>Малые объёмы дают шум: разница может быть случайной.<\/li><li>Платформа показывает варианты разным людям в разное время — условия неравны.<\/li><li>Если вариантов отличается несколько элементов, неясно, что сработало.<\/li><li>Результат одной аудитории не переносится на другую автоматически.<\/li><\/ul>\n<p>Правило курса: <strong>не заявлять «этот ролик увеличивает продажи»<\/strong>, пока нет корректно проведённого теста и данных. Без данных — только «гипотеза».<\/p>\n<hr>", "min": 1}, {"id": "m02-10", "t": "Практика, разбор и частые ошибки", "kind": "practice", "html": "<h3>Пошаговая процедура: анализ ролика (45 мин)<\/h3>\n<ol><li>Выберите ролик 15–30 секунд (не копируйте его, это учебный разбор).<\/li><li>Просмотрите без звука, затем со звуком.<\/li><li>Запишите по секундам, что происходит (таблица шести элементов).<\/li><li>Выполните «моргание» на трёх ключевых кадрах.<\/li><li>Определите структуру повествования и тон.<\/li><li>Выпишите утверждения и отметьте, есть ли доказательство.<\/li><li>Выпишите 3 приёма, которые можно использовать БЕЗ повторения выражения.<\/li><li>Заполните шаблон <a href=\"#res-t02\">T02<\/a> (<a href=\"#res-t02\"><code>RU/toolkit/T02_analiz_reklamy.md<\/code><\/a>).<\/li><\/ol>\n<h3>Как построить три концепции для одного продукта (60–90 мин)<\/h3>\n<ol><li>Возьмите бриф из Модуля 1.<\/li><li>Выберите три разных <strong>структуры<\/strong> (например: проблема→решение, демонстрация, настроение).<\/li><li>Для каждой запишите: идея в одном предложении, главный образ, тон, как показан продукт, призыв, главный риск.<\/li><li>Для каждой запишите обоснование: почему это подходит ЭТОЙ аудитории и ЭТОЙ цели.<\/li><li>Проверьте каждую по тесту на копию (урок 2.1) и на неподтверждённые утверждения (урок 2.7).<\/li><li>Выберите рекомендуемую концепцию и объясните выбор.<\/li><\/ol>\n<h3>Разобранный пример (вымышленный: «Нордик Бристоль», тонкий кошелёк)<\/h3>\n<p><strong>Концепция A (проблема → решение).<\/strong> «Карман-горб»: сцена в кафе, мужчина встаёт, и кошелёк заметно оттопыривает брюки; он поправляет. Кадр с тонким кошельком — карман ровный. Тон: лёгкая ирония. Риск: может выглядеть как насмешка над зрителем — смягчить юмором.<\/p>\n<p><strong>Концепция B (демонстрация).<\/strong> Крупные планы процесса: ручная прошивка, замеры толщины линейкой (8 мм), кладут в карман. Тон: уверенность. Риск: требует точной визуализации реальных деталей, ИИ может искажать швы — часть кадров лучше снять реальной камерой.<\/p>\n<p><strong>Концепция C (настроение).<\/strong> Утро мужчины, который собирается из дома, всё нужное в карманах, кошелёк не замечается. Тон: спокойствие. Риск: без прямого указания выгоды сообщение размыто — нужна фраза-подпись.<\/p>\n<p><strong>Рекомендация (пример):<\/strong> для цели «заказ с лендинга» выбрать A + элемент B (кадр замера толщины как доказательство). Обоснование: A показывает проблему быстро, B даёт проверяемое доказательство.<\/p>\n<p><em>Все данные примера вымышлены.<\/em><\/p>\n<h4>Дополнение: слабая и сильная концепция<\/h4>\n<p><strong>Слабая концепция (вымышленный пример):<\/strong> «Красивый ролик про кошелёк: стильный мужчина, тёмный фон, музыка, логотип в конце».<br>Что не так: нет структуры, нет проблемы, нет доказательства, не ясно, чем это отличается от сотни одинаковых роликов.<\/p>\n<p><strong>Сильная концепция:<\/strong> «Проблема → решение. Кафе, мужчина встаёт, карман оттопыривается, он поправляет. Следующий кадр: тонкий кошелёк, карман ровный. Доказательство: линейка показывает 8 мм. Тон: лёгкая ирония. Призыв: “Заказать на сайте”. Риск: шутка может выглядеть насмешкой; смягчить подачей».<br>Почему лучше: есть структура, цель, доказательство, тон и названный риск.<\/p>\n<p><strong>Практика:<\/strong> запишите слабую концепцию для своего товара, затем превратите её в сильную по шести элементам. Что именно вы добавили?<\/p>\n<h3>Частые ошибки<\/h3>\n<ol><li>Анализ превращается в пересказ сюжета. Исправление: пользоваться таблицей шести элементов.<\/li><li>«Концепции» отличаются только настроением, а структура одна. Исправление: менять структуру.<\/li><li>Копирование отдельных кадров «в другом цвете». Исправление: тест на копию.<\/li><li>Концепция не опирается на цель из брифа. Исправление: каждую концепцию соотносить с целью.<\/li><li>Игнорирование доказательств. Исправление: у каждой выгоды — подтверждение.<\/li><\/ol>\n<h3>Если не получается<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Симптом<\/th><th>Диагностика<\/th><th>Решение<\/th><\/tr><\/thead><tbody><tr><td>Все три идеи одинаковые<\/td><td>Что общего у структур?<\/td><td>Выберите принципиально разные структуры из урока 2.4<\/td><\/tr><tr><td>Идея есть, обоснования нет<\/td><td>Какой пункт брифа она решает?<\/td><td>Привяжите к цели и аудитории<\/td><\/tr><tr><td>Не вижу иерархию кадра<\/td><td>Что цепляет взгляд в 1-й секунде?<\/td><td>Повторите «моргание» на уменьшенном кадре<\/td><\/tr><tr><td>Ролик «слишком похож» на референс<\/td><td>Назовёт ли зритель исходник?<\/td><td>Измените ситуацию, героя, образы<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Практические задания<\/h3>\n<p><strong>Начальный (45 мин, 📱).<\/strong> Разберите один ролик по шести элементам (шаблон <a href=\"#res-t02\">T02<\/a>).<br><strong>Средний (90 мин, 📱💻).<\/strong> Три концепции для вашего брифа с обоснованием.<br><strong>Продвинутый (2 ч, 💻).<\/strong> Разберите три ролика одной категории, найдите общие клише и предложите концепцию, которая от них отличается; опишите, как вы проверите её на тесте (гипотеза, метрика, ограничения).<\/p>", "min": 3}, {"id": "m02-11", "t": "Контрольный тест", "kind": "quiz", "html": "", "min": 2}, {"id": "m02-12", "t": "Итоговая работа, рубрика и источники", "kind": "wrap", "html": "<h3>Рабочий лист<\/h3>\n<p><a href=\"#res-t02\"><code>RU/toolkit/T02_analiz_reklamy.md<\/code><\/a><\/p>\n<h3>Рубрика итоговой работы (3 концепции)<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Критерий<\/th><th>Вес<\/th><th>Полный балл<\/th><\/tr><\/thead><tbody><tr><td>Три разные структуры<\/td><td>25%<\/td><td>Структуры принципиально различаются<\/td><\/tr><tr><td>Привязка к цели и аудитории<\/td><td>25%<\/td><td>Каждая концепция обоснована брифом<\/td><\/tr><tr><td>Оригинальность (тест на копию)<\/td><td>20%<\/td><td>Нет повтора чужого выражения<\/td><\/tr><tr><td>Доказательства и честность утверждений<\/td><td>15%<\/td><td>Каждое утверждение подтверждено или снято<\/td><\/tr><tr><td>Анализ рисков<\/td><td>15%<\/td><td>Для каждой идеи указан главный риск<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Порог зачёта: 70%.<\/p>\n<h3>Критерии завершения<\/h3>\n<ul><li class=\"cb\"><span class=\"box\" aria-hidden=\"true\"><\/span>Выполнен разбор ролика по шаблону <a href=\"#res-t02\">T02<\/a>.<\/li><li class=\"cb\"><span class=\"box\" aria-hidden=\"true\"><\/span>Три концепции составлены и обоснованы.<\/li><li class=\"cb\"><span class=\"box\" aria-hidden=\"true\"><\/span>Тест ≥70%.<\/li><li class=\"cb\"><span class=\"box\" aria-hidden=\"true\"><\/span>Итоговая работа ≥70% по рубрике.<\/li><\/ul>\n<h3>Источники<\/h3>\n<p>Принципы модуля — общая рекламная практика и методика автора. Утверждений о статистике эффективности нет намеренно (не проверялись). Правовые границы копирования уточняются в Модуле 12.<\/p>", "min": 1}], "quiz": [{"q": "Что допустимо взять из чужого ролика?\nА) Конкретные кадры Б) Приём (например, показать проблему сразу) В) Музыку Г) Сценарий", "a": "Б. Приём — общий принцип; кадры, музыка и сценарий — выражение, защищённое правом."}, {"q": "В ролике нет доказательства. Что это означает?", "a": "Выгода звучит как обещание без подтверждения; доверие ниже. Нужно добавить подтверждающий элемент или смягчить утверждение."}, {"q": "Вариант B получил больше кликов, чем A, на малом показе. Можно ли заключить, что B лучше?", "a": "Нет. Малые объёмы дают случайные колебания; условия показа могли отличаться. Можно говорить о гипотезе, но не о доказанном превосходстве."}, {"q": "Что проверяет упражнение «моргание»?", "a": "Куда зритель смотрит в первую секунду; важно, чтобы это был продукт или главное действие."}, {"q": "Почему «лучший на рынке» опасно использовать без источника?", "a": "Это неподтверждённое превосходное утверждение, которое может ввести в заблуждение и привести к жалобам или блокировке рекламы."}, {"q": "Зритель, увидев ваш ролик, сразу говорит «это же как у такого-то бренда». Что делать?", "a": "Вы повторили выражение, а не приём. Измените ситуацию, героя, образы, ритм и музыку; оставьте только общий приём (например, «показать проблему сразу»)."}, {"q": "При «моргании» первым зритель замечает яркий фон, а не продукт. Как исправить?", "a": "Приглушить фон по яркости и детализации, увеличить продукт или контраст, направить взгляд героя или линии кадра на продукт."}, {"q": "Услуга даёт видимый результат, но результат зависит от клиента. Допустим ли ролик «до и после»?", "a": "Допустим только честный: показывать реальный или типичный результат, не обещать гарантированный. Показ нетипичного результата как обычного вводит в заблуждение (подробнее — Модули 12–13)."}, {"q": "Клиент хочет написать «Лучший кошелёк в стране». Что вы делаете?", "a": "Просите источник рейтинга или документ. Нет источника — заменяете проверяемой фразой (например, фактом о толщине 8 мм)."}, {"q": "Два варианта показали ровно 30 людям. У B больше кликов. Можно ли сделать вывод?", "a": "Нет. Выборка мала, разница может быть случайной. Записать как гипотезу и продолжить тест на большем показе."}]}, {"id": "m03", "n": 3, "title": "Бриф клиента и предпроизводство", "deliverable": "Бриф, объём работ и план производства", "meta": "Редакция: RU · Версия: v0.1 · Статус: Drafted · Среда: 📱💻 (платные инструменты не нужны)", "items": [{"id": "m03-1", "t": "Обзор и цели модуля", "kind": "overview", "html": "<div class=\"lockbox\"><p class=\"lk\">🔒 Этот материал входит в полную версию курса.<\/p><p>В демо открыты программа и модули 1–2. Полная версия: все 14 модулей, 20 шаблонов, калькуляторы и итоговый function mountQuiz(modId){
  const m = D.modules.find(x=>x.id===modId), box = $('#quizbox'); if(!box) return;
  const qs = m.quiz; let i = 0, ok = 0, shown = false;
  function draw(){
    if(i>=qs.length){
      const p = Math.round(100*ok/qs.length), pass = p>=70;
      store.quiz[m.id] = {ok, total:qs.length, at:Date.now()}; if(pass){ const it=m.items.find(x=>x.kind==='quiz'); store.done[it.id]=true; } save();
      box.innerHTML = `<div class="quiz"><div class="score">${ok} / ${qs.length}</div><p><strong>${p}%</strong> · ${pass?'Зачёт: порог курса 70% достигнут.':'Ниже порога 70%. Перечитайте уроки модуля и пройдите тест ещё раз.'}</p>
        <p class="note">Это самопроверка: результат основан на вашей честной оценке.</p><div class="row"><button class="btn" id="qre">Пройти заново</button><a class="btn ghost" href="#${m.id}-1">К началу модуля</a></div></div>`;
      $('#qre').onclick = ()=>{ i=0; ok=0; shown=false; draw(); }; return;
    }
    const q = qs[i];
    box.innerHTML = `<div class="quiz"><div class="note">Вопрос ${i+1} из ${qs.length}</div><div class="bar"><i style="width:${Math.round(100*i/qs.length)}%"></i></div>
      <p style="font-size:1.08rem"><strong>${q.q}</strong></p>
      <label class="note" for="qa">Ваш ответ своими словами (по желанию; не сохраняется)</label><textarea id="qa"></textarea>
      <div class="row" style="margin-top:12px"><button class="btn" id="qshow">Показать ответ</button></div><div id="qres"></div></div>`;
    $('#qshow').onclick = ()=>{
      $('#qres').innerHTML = `<div class="ans"><strong>Ответ</strong><p style="margin:6px 0 0">${q.a}</p></div><p>Вы ответили верно?</p><div class="row"><button class="btn accent" id="qy">Да, верно</button><button class="btn ghost" id="qn">Нет, нужно повторить</button></div>`;
      $('#qshow').disabled = true;
      $('#qy').onclick = ()=>{ ok++; i++; draw(); };
      $('#qn').onclick = ()=>{ i++; draw(); };
    };
  }
  const prevRes = store.quiz[m.id];
  if(prevRes){ box.innerHTML = `<div class="quiz"><p>Последний результат: <strong>${prevRes.ok} из ${prevRes.total}</strong> (${Math.round(100*prevRes.ok/prevRes.total)}%).</p><button class="btn" id="qgo">Пройти тест</button></div>`; $('#qgo').onclick = draw; }
  else draw();
}

/* ---------- search, a11y, motion ---------- */
let IDX = null;
function buildIdx(){
  IDX = ALL.map(x=>{ const d=document.createElement('div');
    d.innerHTML = x.it.kind==='quiz' ? x.m.quiz.map(q=>q.q+' '+q.a).join(' ') : (x.it.html||'');
    const text=(d.textContent||'').replace(/\s+/g,' ').trim();
    return {m:x.m,it:x.it,text,low:(x.it.t+' '+text).toLowerCase()}; });
}
function mountSearch(host){
  if(!host) return;
  host.innerHTML = '<label class="note" for="srch-'+host.id+'">Поиск по курсу</label><input id="srch-'+host.id+'" type="search" placeholder="Например: громкость, правки, референс" autocomplete="off"><div class="sres" aria-live="polite"></div>';
  const inp=host.querySelector('input'), out=host.querySelector('.sres');
  inp.addEventListener('input', ()=>{
    const q=inp.value.trim().toLowerCase(); if(q.length<2){ out.innerHTML=''; return; }
    if(!IDX) buildIdx();
    const ws=q.split(/\s+/); const hits=IDX.filter(e=>ws.every(w=>e.low.includes(w))).slice(0,12);
    out.innerHTML = hits.length ? hits.map(e=>{ const i=e.text.toLowerCase().indexOf(ws[0]); const sn=i>=0?('…'+e.text.slice(Math.max(0,i-40),i+70)+'…'):''; return `<a href="#${e.it.id}"><strong>${esc(e.it.t)}</strong><small>Модуль ${e.m.n} · ${esc(sn)}</small></a>`; }).join('') : '<p class="note">Ничего не найдено. Попробуйте другое слово.</p>';
  });
}
function enhance(){
  $$('.tw').forEach(t=>{ t.tabIndex=0; if(!t.getAttribute('role')){ t.setAttribute('role','region'); t.setAttribute('aria-label','Таблица, прокручивается по горизонтали'); } });
  $$('.bar').forEach(b=>b.setAttribute('aria-hidden','true'));
  mountSearch($('#progsearch')); mountSearch($('#sidesearch'));
  const mn=$('#main'); if(mn){ mn.tabIndex=-1; try{ mn.focus({preventScroll:true}); }catch(e){} }
  if('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{threshold:.12});
    $$('section.block').forEach(s=>io.observe(s));
  }
  const rb=$('#resetbtn'); if(rb) rb.onclick=()=>{ $('#resetbox').innerHTML='<p><strong>Точно сбросить весь прогресс?</strong></p><div class="row"><button class="btn" id="rsy">Да, сбросить</button><button class="btn ghost" id="rsn">Отмена</button></div>';
    $('#rsy').onclick=()=>{ store={done:{},quiz:{},proj:{},launch:{}}; save(); toast('Прогресс сброшен'); location.hash='#home'; render(); };
    $('#rsn').onclick=()=>{ render(); }; };
  $$('[data-copy]').forEach(b=>b.onclick=()=>copyText(($('#'+b.dataset.copy)||{}).innerText||''));
}
function browserDownload(name, data){
  try{ const blob = data instanceof Blob ? data : new Blob([data]); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true; }catch(e){ return false; }
}

/* ---------- router ---------- */
function firstOpen(){ const x = ALL.find(a=>!store.done[a.it.id]); return (x||ALL[0]).it.id; }
function render(){
  let r = (location.hash||'#home').slice(1) || 'home';
  let page, active = 'home', after = null;
  if(r==='learn'){ r = firstOpen(); history.replaceState(null,'','#'+r); }
  if(/^m\d\d-\d+$/.test(r)){ page = pageLesson(r); active='learn';
    after = ()=>{ const it = ALL.find(a=>a.it.id===r); if(it && it.it.kind==='quiz') mountQuiz(it.m.id);
      const pc=$('#projchk'); if(pc && it) pc.onchange=()=>{ store.proj['p'+(it.m.n-1)]=pc.checked; save(); };
      $('#donebtn').onclick = e=>{ const id=e.target.dataset.id; store.done[id] = !store.done[id]; save(); render(); };
      const sb=$('#sidebtn'); if(sb) sb.onclick=()=>{ const s=$('#side'); const o=s.classList.toggle('open'); sb.setAttribute('aria-expanded', o); }; }; }
  else if(r.startsWith('res-')){ page = pageResource(r.slice(4)); active='resources';
    after = ()=>{ const res = D.resources.find(x=>x.id===r.slice(4)); if(!res) return;
      const sv=$('#rsave'); if(sv) sv.onclick=()=>saveFile(res.dl, res.b64 ? b64ToBytes(res.b64) : res.text);
      const cp=$('#rcopy'); if(cp) cp.onclick=()=>copyText(res.text); }; }
  else switch(r){
    case 'start': page=pageStart(); active='home'; break;
    case 'program': page=pageProgram(); active='program'; break;
    case 'resources': page=pageResources(); active='resources'; after=()=>{ const z=$('#zipbtn'); if(z) z.onclick=()=>saveFile('ai-ad-studio-pro_RU_v0.1.zip', b64ToBytes(D.zip)); }; break;
    case 'project': page=pageProject(); active='project'; after=()=>{ $$('input[data-p]').forEach(c=>c.onchange=()=>{ store.proj[c.dataset.p]=c.checked; save(); const n=PROJECT.filter((_,i)=>store.proj['p'+i]).length; $('#pn').textContent=n; $('#pbar').style.width=Math.round(100*n/PROJECT.length)+'%'; }); }; break;
    case 'faq': page=pageFaq(); active='faq'; break;
    case 'support': page=pageSupport(); active='home'; break;
    case 'policies': page=pagePolicies(); active='home'; break;
    case 'checkout': page=pageCheckout(); active='home'; break;
    case 'status': page=pageStatus(); active='home'; break;
    case 'launch': if(D.edition!=='author'){ page=pageHome(); active='home'; break; } page=pageLaunch(); active='launch'; after=()=>{ $$('input[data-l]').forEach(c=>c.onchange=()=>{ store.launch[c.dataset.l]=c.checked; save(); const n=LAUNCH.filter((_,i)=>store.launch['l'+i]).length; $('#ln').textContent=n; $('#lbar').style.width=Math.round(100*n/LAUNCH.length)+'%'; }); }; break;
    default: page=pageHome(); active='home';
  }
  $('#app').innerHTML = shell(active, page, {noStrip: /^m\d\d-\d+$/.test(r)});
  window.scrollTo(0,0);
  if(after) after();
  enhance();
  const dlb = $$('.btn-dl'); if(dlb.length) getDL();
}
window.addEventListener('hashchange', render);
render();
</script>
